trainer:
  target: trainer_video.TrainerDifVSR

model:
  target: models.unet.DiTSRModel
  ckpt_path: ~
  params:
    image_size: 64   # resolution the UNet works at, i.e. pixel size / patch_size
    patch_size: 4    # pixel-unshuffle factor: pixel-space input is folded to image_size x image_size before the UNet
    in_channels: 3
    model_channels: 128
    out_channels: 3
    attention_resolutions: [64,32,16]
    dropout: 0.1
    channel_mult: [1, 2, 2, 4]
    conv_resample: True
    dims: 2
    use_fp16: False
    num_head_channels: 32
    swin_depth: 4
    swin_embed_dim: 160
    window_size: 8
    mlp_ratio: 4
    cond_lq: True
    lq_size: 64

diffusion:
  target: models.script_util.create_gaussian_diffusion
  params:
    sf: 4
    schedule_name: exponential
    schedule_kwargs:
      power: 0.3
    etas_end: 0.99
    steps: 15
    min_noise_level: 0.04
    kappa: 2.0
    weighted_mse: False
    predict_type: xstart
    timestep_respacing: ~
    scale_factor: 1.0
    normalize_input: True
    latent_flag: False

# Optional WeatherDiff-style patch-based restoration (patch_restoration.py). Disabled by default.
# When enabled, the whole clip is restored in ONE reverse process; at every step the model is applied to
# overlapping space-time patches of the current x_t, the outputs are averaged per pixel, and one diffusion
# update is done on the full tensor (no tiling seams, works for any input size >= patch_size).
# Used by inference_video.py (override with --patch_restoration true/false) and by validation.
patch_restoration:
  enabled: False
  patch_size: 256        # HR pixels; must equal the training crop (degradation.gt_size)
  patch_stride: 128      # HR pixels; patch_size // 2 -> 4x the cost of non-overlapping patches
  patch_frames: ~        # temporal patch length; ~ (null) -> all frames of the clip
  frame_stride: ~        # temporal stride; ~ -> patch_frames // 2
  weighting: uniform     # uniform (WeatherDiff) | tent (down-weights patch borders)
  batch_size: 8          # patches per model call

degradation:
  sf: 4
  # the first degradation process
  resize_prob: [0.2, 0.7, 0.1]  # up, down, keep
  resize_range: [0.15, 1.5]
  gaussian_noise_prob: 0.5
  noise_range: [1, 30]
  poisson_scale_range: [0.05, 3.0]
  gray_noise_prob: 0.4
  jpeg_range: [30, 95]

  # the second degradation process
  second_order_prob: 0.5
  second_blur_prob: 0.8
  resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
  resize_range2: [0.3, 1.2]
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]

  queue_size: 64          # training-pair pool (clips); must be divisible by the batch size
  gt_size: 256
  resize_back: False
  use_sharp: False

data:
  train:
    type: video_realesrgan
    params:
      # folders searched (recursively) for videos: a video is a folder of frames or a video file (.mp4 ...)
      dir_paths: ['/path/to/train_videos']
      num_frames: 5             # T: frames per training clip
      frame_stride: [1, 2]      # temporal stride, sampled per clip
      reverse_prob: 0.1         # play the clip backwards
      io_backend:
        type: disk
      blur_kernel_size: 21
      kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
      kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
      sinc_prob: 0.1
      blur_sigma: [0.2, 3.0]
      betag_range: [0.5, 4.0]
      betap_range: [1, 2.0]

      blur_kernel_size2: 15
      kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
      kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
      sinc_prob2: 0.1
      blur_sigma2: [0.2, 1.5]
      betag_range2: [0.5, 4.0]
      betap_range2: [1, 2.0]

      final_sinc_prob: 0.8

      gt_size: 256
      crop_pad_size: 300
      use_hflip: True
      use_rot: False
      rescale_gt: True
  val:
    type: video_paired
    params:
      lq_path: /path/to/val_videos/lq    # videos (frame folders or files)
      gt_path: /path/to/val_videos/gt    # same names as in lq_path; optional
      num_frames: 5
      mean: 0.5
      std: 0.5

train:
  # learning rate
  lr: 5e-5                      # learning rate 
  lr_min: 2e-5                      # learning rate 
  lr_schedule: ~
  warmup_iterations: 5000
  # dataloader
  batch: [16, 1]                
  microbatch: 2
  num_workers: 4
  prefetch_factor: 2            
  # optimization settings
  weight_decay: 0               
  ema_rate: 0.999
  iterations: 300000            # total iterations
  # save logging
  save_freq: 10000              
  log_freq: [200, 2000, 1]         # [training loss, training images, val images]
  local_logging: True           # manually save images
  tf_logging: False             # tensorboard logging
  # validation settings
  use_ema_val: True            
  val_freq: ${train.save_freq}
  val_y_channel: True
  val_resolution: ${model.params.lq_size}
  val_padding_mode: reflect
  # training setting
  use_amp: True                # amp training
  seed: 123456                 # random seed
  global_seeding: False
  # model compile
  compile:
    flag: False
    mode: reduce-overhead      # default, reduce-overhead
